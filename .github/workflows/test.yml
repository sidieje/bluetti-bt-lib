name: Unittests
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A floor-version failure should not cancel the run that says whether the
      # newest interpreter still works.
      fail-fast: false
      matrix:
        # 3.11 is the floor setup.py declares, and the code does need it: the
        # readers catch a bare TimeoutError where asyncio.TimeoutError is in
        # play, and those name one class only from 3.11 up. Declaring a floor is
        # worth little while CI only ever runs the newest, so test both ends.
        # "3.x" is whatever setup-python offers today, which keeps the top end
        # covered without a commit per Python release.
        python-version: ["3.11", "3.x"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Run unittests
      run: python -m unittest discover -s tests -p "*.py"
    - name: Run bluetooth unittests
      run: python -m unittest discover -s tests/bluetooth -p "*.py"
    - name: Run field unittests
      run: python -m unittest discover -s tests/fields -p "*.py"
    - name: Run register unittests
      run: python -m unittest discover -s tests/registers -p "*.py"
    - name: Run base device unittests
      run: python -m unittest discover -s tests/base_devices -p "*.py"
    - name: Run device unittests
      run: python -m unittest discover -s tests/devices -p "*.py"
